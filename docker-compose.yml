# Oracle Enterprise Database Container
# Created: 2026-09-19 10:00
# Updated: 2026-10-18 22:14

x-base-config: &base-config
  restart: on-failure

x-env-config: &env-config
  ORACLE_PWD: ${ORACLE_PWD:-MyPassword123!}

services:
  oracle-db:
    <<: *base-config
    image: container-registry.oracle.com/database/enterprise:latest
    container_name: oracle-db
    hostname: oracle-host
    environment:
      <<: *env-config
      ORACLE_APP_USERNAME: ${ORACLE_APP_USERNAME:-zouari}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:-MyApp123!}
      ORACLE_HR_PASSWORD: ${ORACLE_HR_PASSWORD:-MyHr123!}
      ORACLE_SID: ${ORACLE_SID:-PRODCDB}
      ORACLE_PDB: ${ORACLE_PDB:-PRODPDB1}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET:-AL32UTF8}
      ENABLE_ARCHIVELOG: ${ENABLE_ARCHIVELOG:-false}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - /etc/localtime:/etc/localtime:ro
      - ./init-script:/opt/oracle/scripts/startup
    expose: [1521]
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 2m

